<!doctype html>
<html>
    <head>
        <title>Sales Import Generator</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="{{url_for('static', filename='css/styles.css')}}"
            rel="stylesheet"
        />
        <!-- for dev -->
        <!-- <script src="https://cdn.tailwindcss.com"></script> -->
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    </head>
    <body
        class="bg-[#F2F2F2] text-[#333333] h-screen flex justify-center items-center"
        x-data="{ option: 'none', selectedOption: 'ginee', submitted:false }"
    >
        <div
            class="w-4/5 sm:w-3/5 md:w-2/5 px-4 py-8 lg:w-1/3 xl:w-1/4 2xl:w-1/4 shadow-lg"
        >
            <h1 class="text-2xl font-semibold text-center mb-2">
                Sales Import Generator
            </h1>
            <form
                hx-encoding="multipart/form-data"
                hx-post="/api/single-sales-import"
                hx-target="#responseData"
                class="flex flex-col gap-3"
            >
                <!-- single upload view -->
                <div class="flex justify-between items-center">
                    <label>File</label>
                    <label
                        class="shadow-md px-4 py-1 hover:opacity-85 rounded-md"
                        for="file"
                        >Select file</label
                    >
                    <input
                        type="file"
                        id="file"
                        name="file"
                        class="hidden"
                        multiple="false"
                    />
                </div>
                <div class="flex justify-between items-center">
                    <label>Store</label>
                    <select
                        name="store"
                        id="store-select"
                        disabled
                        class="px-2 py-1 shadow-md hover:opacity-85 rounded-md"
                        x-on:change="() => {
                            document.getElementById('store').value = selectedOption;
                        }"
                    >
                        <option value="ginee">GINEE</option>
                        <option value="shopee">SHOPEE</option>
                    </select>
                </div>
                <div class="flex justify-between items-center">
                    <label>Starting No.</label>
                    <input
                        type="number"
                        id="startingNumber"
                        name="starting_num"
                        class="py-1 px-3 rounded-md"
                    />
                </div>
                <div class="flex justify-between items-center">
                    <label>Version</label>
                    <select
                        name="version"
                        id="version-select"
                        class="px-2 py-1 shadow-md hover:opacity-85 rounded-md"
                        x-on:change="() => {
                            document.getElementById('version').value = selectedOption;
                        }"
                    >
                        <option value="v1">Version 1</option>
                        <option value="v2">Version 2</option>
                    </select>
                </div>
                <button
                    x-on:click="submitted = true"
                    type="submit"
                    class="block text-[#F2F2F2] bg-green-800 py-1 font-semibold text-center w-full rounded-lg hover:opacity-85"
                >
                    Convert
                </button>
            </form>
            <div id="responseData" class="hidden" hx-swap="innerHTML"></div>
            <div
                id="successResponse"
                style="display: none"
                class="flex-col gap-1 rounded-lg shadow-lg mt-6 py-2 px-3"
            >
                <div class="flex justify-between w-full">
                    <p>Your File:</p>
                    <a
                        class="text-blue-900 hover:cursor-pointer"
                        id="linkHolder"
                    ></a>
                </div>
                <a
                    x-on:click="() => {
                               submitted = false;
                               document.getElementById(
                                   'successResponse',
                                   ).style.display = 'none';
                               }"
                    class="block text-right hover:cursor-pointer"
                    >Convert again</a
                >
            </div>
            <div
                id="failedResponse"
                style="display: none"
                class="flex-col gap-1 rounded-lg shadow-lg mt-6 py-2 px-3"
            >
                <!-- <div class="flex justify-between w-full">
                    <p>Your File:</p>
                    <a
                        class="text-blue-900 hover:cursor-pointer"
                        id="linkHolder"
                    ></a>
                </div> -->
                <p class="w-full">File Error: Kindly check your file again.</p>
                <a
                    x-on:click="() => {
                               submitted = false;
                               document.getElementById(
                                   'failedResponse',
                                   ).style.display = 'none';
                               }"
                    class="block text-right hover:cursor-pointer"
                    >Convert again</a
                >
            </div>
            <script>
                document.addEventListener("htmx:afterRequest", (evt) => {
                    console.log(evt);

                    if (evt.detail.failed === false) {
                        const fileName =
                            document.getElementById("responseData").innerHTML;
                        const linkHolder =
                            document.getElementById("linkHolder");
                        // validate HTTP response status code
                        linkHolder.innerHTML = fileName;
                        linkHolder.href = `/api/download-file?file=${fileName}`;

                        document.getElementById(
                            "successResponse",
                        ).style.display = "flex";

                        document.getElementById(
                            "failedResponse",
                        ).style.display = "none";
                    } else {
                        // handle errors
                        document.getElementById(
                            "successResponse",
                        ).style.display = "none";

                        // handle errors
                        document.getElementById(
                            "failedResponse",
                        ).style.display = "block";
                    }
                });
            </script>
        </div>
    </body>
</html>
